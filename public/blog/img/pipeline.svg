<svg viewBox="0 0 1080 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#171717"/>
      <stop offset="100%" stop-color="#0f0f0f"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.10"/>
      <stop offset="60%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=DM+Sans:wght@400;500;600&amp;display=swap');
      .serif{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
      .sans{font-family:'DM Sans',Helvetica,sans-serif}
    </style>
  </defs>

  <rect width="1080" height="480" fill="#060606"/>

  <!-- Stage 1 card -->
  <g transform="translate(40, 80)">
    <rect width="300" height="320" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="300" height="320" rx="16" fill="url(#cardGlow)"/>
    <text x="24" y="40" class="sans" fill="#c084fc" font-size="11" letter-spacing="2" font-weight="600">STAGE 1</text>
    <text x="24" y="92" class="serif" fill="#f8f8f8" font-size="28">Understanding</text>
    <text x="24" y="124" class="serif" fill="#f8f8f8" font-size="28">your prompt</text>
    <text x="24" y="170" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">A language model turns</text>
    <text x="24" y="190" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">your one-line idea into a</text>
    <text x="24" y="210" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">structured plan: tempo,</text>
    <text x="24" y="230" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">key, instruments,</text>
    <text x="24" y="250" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">structure, mood.</text>
    <g transform="translate(24, 280)">
      <rect x="0" y="0" width="120" height="3" fill="rgba(192,132,252,0.7)" rx="1.5"/>
      <rect x="0" y="10" width="180" height="3" fill="rgba(192,132,252,0.5)" rx="1.5"/>
      <rect x="0" y="20" width="90" height="3" fill="rgba(192,132,252,0.4)" rx="1.5"/>
    </g>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(345, 220)">
    <line x1="0" y1="20" x2="40" y2="20" stroke="url(#grad)" stroke-width="2"/>
    <polygon points="40,14 50,20 40,26" fill="url(#grad)"/>
  </g>

  <!-- Stage 2 card -->
  <g transform="translate(390, 80)">
    <rect width="300" height="320" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="300" height="320" rx="16" fill="url(#cardGlow)"/>
    <text x="24" y="40" class="sans" fill="#c084fc" font-size="11" letter-spacing="2" font-weight="600">STAGE 2</text>
    <text x="24" y="92" class="serif" fill="#f8f8f8" font-size="28">Lyrics &amp;</text>
    <text x="24" y="124" class="serif" fill="#f8f8f8" font-size="28">vocal melody</text>
    <text x="24" y="170" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">A second model writes the</text>
    <text x="24" y="190" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">words and decides which</text>
    <text x="24" y="210" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">notes the singer hits, and</text>
    <text x="24" y="230" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">how long they hold them.</text>
    <g transform="translate(24, 275)" stroke="url(#grad)" stroke-width="2" fill="none">
      <circle cx="6" cy="20" r="5" fill="url(#grad)"/>
      <line x1="11" y1="20" x2="11" y2="0"/>
      <circle cx="36" cy="14" r="5" fill="url(#grad)"/>
      <line x1="41" y1="14" x2="41" y2="-6"/>
      <line x1="11" y1="0" x2="41" y2="-6"/>
    </g>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(695, 220)">
    <line x1="0" y1="20" x2="40" y2="20" stroke="url(#grad)" stroke-width="2"/>
    <polygon points="40,14 50,20 40,26" fill="url(#grad)"/>
  </g>

  <!-- Stage 3 card -->
  <g transform="translate(740, 80)">
    <rect width="300" height="320" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <rect width="300" height="320" rx="16" fill="url(#cardGlow)"/>
    <text x="24" y="40" class="sans" fill="#c084fc" font-size="11" letter-spacing="2" font-weight="600">STAGE 3</text>
    <text x="24" y="92" class="serif" fill="#f8f8f8" font-size="28">Audio</text>
    <text x="24" y="124" class="serif" fill="#f8f8f8" font-size="28">synthesis</text>
    <text x="24" y="170" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">Diffusion or transformer</text>
    <text x="24" y="190" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">models (usually a hybrid)</text>
    <text x="24" y="210" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">turn the plan into actual</text>
    <text x="24" y="230" class="sans" fill="rgba(248,248,248,0.55)" font-size="14">sound waves.</text>
    <g transform="translate(24, 280)">
      <rect x="0"  y="-12" width="3" height="24" fill="rgba(248,248,248,0.4)" rx="1.5"/>
      <rect x="8"  y="-20" width="3" height="40" fill="rgba(248,248,248,0.5)" rx="1.5"/>
      <rect x="16" y="-8"  width="3" height="16" fill="rgba(248,248,248,0.35)" rx="1.5"/>
      <rect x="24" y="-25" width="3" height="50" fill="url(#grad)" rx="1.5"/>
      <rect x="32" y="-15" width="3" height="30" fill="url(#grad)" rx="1.5"/>
      <rect x="40" y="-22" width="3" height="44" fill="url(#grad)" rx="1.5"/>
      <rect x="48" y="-10" width="3" height="20" fill="rgba(248,248,248,0.4)" rx="1.5"/>
      <rect x="56" y="-18" width="3" height="36" fill="rgba(248,248,248,0.5)" rx="1.5"/>
      <rect x="64" y="-7"  width="3" height="14" fill="rgba(248,248,248,0.3)" rx="1.5"/>
    </g>
  </g>

  <text x="540" y="455" text-anchor="middle" class="sans" fill="rgba(248,248,248,0.30)" font-size="13" letter-spacing="0.4">Three specialized models, each handling a different job, stitched into one pipeline.</text>
</svg>
